# OpenOCD config for LDSDR rev2.1 (XC7Z010 + AD9363 + FT4232HL onboard JTAG)
#
# FT4232HL pin mapping (from LDSDR schematic page JTAG_USB_USART):
#   Channel A (U33.2, openocd channel 0) — reserved/SPI?
#   Channel B (U33.3, openocd channel 1) — JTAG (FPGA_TCK/TDI/TDO/TMS) ← we use this
#   Channel C (U33.4, openocd channel 2) — UART0 (/dev/ttyUSB2)
#   Channel D (U33.5, openocd channel 3) — UART1 (/dev/ttyUSB3)
#
# Pin assignment on Channel B (BDBUS):
#   BDBUS0 = TCK    (output)
#   BDBUS1 = TDI    (output)
#   BDBUS2 = TDO    (input)
#   BDBUS3 = TMS    (output)
#   BDBUS4-7 = unused
#
# layout_init bit format (16-bit, lo=data, hi=direction):
#   low byte  (BDBUS0..7 default): 0x08  (TMS high, others low)
#   high byte (direction, 1=output): 0x0b (TCK=out, TDI=out, TDO=in, TMS=out)
#
#   Combined: data=0x0008, direction=0x000b → layout_init 0x0008 0x000b

adapter driver ftdi
transport select jtag

# FT4232H stock VID/PID (LDSDR didn't reprogram EEPROM, unlike PlutoSDR)
ftdi vid_pid 0x0403 0x6011

# Channel B = openocd channel 1 (per LDSDR schematic)
ftdi channel 1

# Initial GPIO state and direction for BDBUS channel B
ftdi layout_init 0x0008 0x000b

# JTAG clock speed (start slow, can increase after init works)
adapter speed 1000

# No external SRST/TRST on LDSDR -- JTAG only
reset_config none

# Pull in standard Zynq-7000 TAP definitions (provides zynqpl_program proc)
source [find target/zynq_7000.cfg]
